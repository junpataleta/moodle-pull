<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="color-scheme" content="light dark">
        <title>Moodle Pull</title>
        <link href="../lib/bootstrap-5.3.9.min.css" rel="stylesheet">
        <link href="popup.css" rel="stylesheet">
        <script src="../color-mode.js"></script>
    </head>
    <body>
        <div class="card" id="pull-container" style="min-width: 36rem;">
            <div class="card-body">
                <p class="card-text">Click one of the buttons to generate a pull command for the appropriate Moodle branch:</p>
                <div id="notice" class="alert alert-info py-2" role="status" hidden></div>
                <form id="pull-form">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th scope="col">Command</th>
                                <th scope="col">Action buttons</th>
                            </tr>
                        </thead>
                        <tbody id="pull-table-body">
                            <!-- Table rows will be dynamically generated here -->
                        </tbody>
                    </table>
                    <div id="bulkCommands" hidden>
                        <button type="button" class="btn btn-primary" id="pullAll">Pull all</button>
                        <button type="button" class="btn btn-primary" id="pushCommand">Push command</button>
                    </div>
                </form>
            </div>
        </div>
        <script src="../lib/bootstrap-5.3.9.bundle.min.js"></script>
        <script src="../default-config.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
