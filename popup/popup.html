<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="color-scheme" content="light dark">
        <title>Moodle Pull</title>
        <link href="../lib/bootstrap-5.3.9.min.css" rel="stylesheet">
        <link href="popup.css" rel="stylesheet">
        <script src="../color-mode.js"></script>
    </head>
    <body>
        <main class="p-3" aria-labelledby="issue-key">
            <header class="d-flex flex-wrap align-items-baseline column-gap-2 mb-3">
                <h1 id="issue-key" class="h6 mb-0">Moodle Pull</h1>
                <span id="repository" class="ms-auto small font-monospace text-body-secondary text-break"></span>
            </header>

            <div id="notice" class="alert alert-info py-2 mb-0" hidden></div>

            <div id="controls" hidden>
                <section id="all-branches" class="mb-3" aria-labelledby="all-branches-heading">
                    <h2 id="all-branches-heading" class="section-heading small fw-semibold text-body-secondary mb-1">
                        All branches<span id="all-branches-summary" class="fw-normal"></span>
                    </h2>
                    <button type="button" id="copy-pull-all" class="btn btn-primary w-100 text-start fw-semibold mb-2">
                        <span id="copy-pull-all-label"></span>
                    </button>
                    <button type="button" id="copy-push" class="btn btn-outline-secondary w-100 text-start"></button>
                </section>

                <section aria-labelledby="one-branch-heading">
                    <h2 id="one-branch-heading" class="section-heading small fw-semibold text-body-secondary mb-1">One branch</h2>
                    <fieldset class="mb-2" aria-describedby="command-description">
                        <legend class="visually-hidden">Command</legend>
                        <div id="command-options" class="d-flex flex-wrap gap-1"></div>
                        <p id="command-description" class="small text-body-secondary mt-1 mb-0" hidden></p>
                    </fieldset>
                    <ul id="branch-list" class="list-group" aria-labelledby="one-branch-heading"></ul>
                </section>
            </div>

            <div class="mt-3 small">
                <!-- Only the confirmation message is announced. The copied command is a sibling, outside the live region,
                     so screen readers don't read the whole git command aloud, but it can still be read on demand. -->
                <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
                <pre id="copied-command" class="copied-command font-monospace small bg-body-tertiary border rounded p-2 mt-1 mb-0" hidden></pre>
            </div>
        </main>
        <script src="../default-config.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
